name: Build Microsoft Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ValueGenerator.slnx -p:Platform=x64
      - name: Build Debug
        run: dotnet build ValueGenerator.slnx -p:Platform=x64 --no-restore -warnaserror
      - name: Test Release
        run: dotnet test tests/ValueGenerator.UnitTests/ValueGenerator.UnitTests.csproj -c Release -p:Platform=x64 --no-restore --logger trx --results-directory TestResults
      - name: Build and validate StoreUpload
        shell: pwsh
        run: ./build/Build-StorePackage.ps1
      - name: Upload Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ValueGenerator-Store-x64
          path: |
            src/ValueGenerator/AppPackages/Store/**/*.msixupload
            src/ValueGenerator/AppPackages/Store/**/*.msix
            src/ValueGenerator/AppPackages/Store/**/*.appxsym
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30
